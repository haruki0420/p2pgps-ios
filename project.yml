# XcodeGen project spec — CI-only build/link verification.
#
# The shipping build path is xtool (SwiftPM). This project exists so GitHub
# Actions can run a real Xcode compile + link of the whole app, which catches
# things `swift build --triple` does not (UIKit/SwiftUI availability, the
# static `libidevice_ffi.a` link, Info.plist validity).
#
# Unlike the SwiftPM package, this project compiles every source directory as a
# single module (the same shape as TLocation's Xcode project). The sources use
# `#if SWIFT_PACKAGE` around their cross-module imports, which is defined only
# by SwiftPM, so both build systems compile the same files unchanged.
#
# Generate with:  xcodegen generate
# Build with:     xcodebuild -project P2PGPS.xcodeproj -scheme P2PGPSApp \
#                   -destination 'generic/platform=iOS' \
#                   CODE_SIGNING_ALLOWED=NO build
name: P2PGPS
options:
  bundleIdPrefix: jp.haruki0420
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    # The ported TLocation engine is Swift 5 source. The SwiftPM package builds
    # P2PGPSProtocol / P2PGPSCore in Swift 6 language mode; this Xcode build
    # uses Swift 5 mode for the whole single module (see wiki/Architecture.md).
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  P2PGPSApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/P2PGPSProtocol
      - path: Sources/P2PGPSCore
      - path: Sources/P2PGPSBLE
      - path: Sources/P2PGPSLocation
      - path: Sources/P2PGPSInjection
      - path: Sources/P2PGPSApp
        excludes:
          - Info.plist
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.haruki0420.p2pgps
        PRODUCT_NAME: P2PGPSApp
        INFOPLIST_FILE: Sources/P2PGPSApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # The vendored idevice module: header + module map for `import idevice`,
        # and the static library fetched by scripts/fetch-vendor.sh.
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/idevice"
        OTHER_LDFLAGS: "$(inherited) -L$(SRCROOT)/Vendor/idevice -lidevice_ffi"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

schemes:
  P2PGPSApp:
    build:
      targets:
        P2PGPSApp: all
    run:
      config: Debug
    archive:
      config: Release
