name: Release IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned IPA and attach to release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Fetch vendored idevice library
        run: bash scripts/fetch-vendor.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project P2PGPS.xcodeproj \
            -scheme P2PGPSApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Debug-iphoneos/P2PGPSApp.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA="p2pgps-ios-${{ inputs.tag }}-unsigned.ipa"
          zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          ls -lh "$IPA"

      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="p2pgps-ios-${{ inputs.tag }}-unsigned.ipa"
          gh release upload "${{ inputs.tag }}" "$IPA" "$IPA.sha256" --clobber
