name: Release IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned IPA and attach to release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Fetch vendored idevice library
        run: bash scripts/fetch-vendor.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Release configuration on purpose: Debug builds embed Xcode's
      # `*.debug.dylib` / `__preview.dylib`, which SideStore cannot re-sign
      # reliably (the install spinner never finishes). Release builds are a
      # single executable and are what a sideloaded IPA should contain.
      - name: Build app (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project P2PGPS.xcodeproj \
            -scheme P2PGPSApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_DEBUG_DYLIB=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/P2PGPSApp.app"
          test -d "$APP_PATH"

          # Fail loudly if a Debug-style dylib slipped into the bundle: those
          # break SideStore's re-signing and cause an endless install spinner.
          if find "$APP_PATH" -maxdepth 1 \( -name '*.debug.dylib' -o -name '__preview.dylib' \) | grep -q .; then
            echo "Debug dylib found in the app bundle; refusing to package." >&2
            find "$APP_PATH" -maxdepth 1 -name '*.dylib' -print >&2
            exit 1
          fi

          # Stamp the version from the tag so SideStore sees a newer version
          # than the previously installed build (the Info.plist in the repo is
          # intentionally version-agnostic).
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          BUILD_NUMBER="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "$APP_PATH/Info.plist"
          echo "Stamped version ${VERSION} (${BUILD_NUMBER})"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          IPA="p2pgps-ios-${{ inputs.tag }}-unsigned.ipa"
          zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          ls -lh "$IPA"
          unzip -l "$IPA" | head -30

      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="p2pgps-ios-${{ inputs.tag }}-unsigned.ipa"
          gh release upload "${{ inputs.tag }}" "$IPA" "$IPA.sha256" --clobber
