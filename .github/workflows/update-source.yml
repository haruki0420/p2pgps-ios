name: Update SideStore source

# Regenerates `source/apps.json` (AltStore / SideStore source format) whenever a
# release is published or the "Release IPA" build succeeds.
#
# Both triggers are needed:
#   * draft-first: Release IPA finishes while the release is still a draft.
#     That run skips, and `release: published` runs after the IPA is attached.
#   * publish-first: the release is published before the IPA exists. That run
#     skips, and `workflow_run: Release IPA` runs after the IPA is attached.
#
# Branch protection blocks direct pushes to `main`, so this workflow opens a
# pull request instead. A human or review agent must post `review-gate` and
# merge it.
#
# NOTE: SideStore can only read the source over a *public* URL. This repository
# is public, so `source/apps.json` and the IPA assets are served directly from
# GitHub — see wiki/Source.md.

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release IPA"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest published release)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sidestore-source
  cancel-in-progress: true

jobs:
  update-source:
    name: Regenerate apps.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "release" ]; then
            TAG="$RELEASE_TAG"
          fi
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            git fetch --tags --force
            TAG=$(git tag --points-at "$WORKFLOW_RUN_SHA" | sort -V | tail -1)
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 20 \
              --json tagName,isDraft \
              --jq '[.[] | select(.isDraft == false)][0].tagName')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No published release found." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Check release and IPA asset
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"

          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "Release $TAG is still a draft; waiting for publish."
            exit 0
          fi
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            echo "Release $TAG is a pre-release; skipping."
            exit 0
          fi

          IPA_COUNT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '[.assets[] | select(.name | endswith(".ipa"))] | length')
          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "No IPA asset for $TAG; waiting for the Release IPA workflow."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate source JSON
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/generate_source.py \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --output source/apps.json

      - name: Create or update source PR
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="chore/source-${TAG}"

          if git diff --quiet -- source/apps.json; then
            echo "source/apps.json is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add source/apps.json
          git commit -m "chore: update SideStore source for ${TAG}"
          git push --force origin "$BRANCH"

          TITLE="chore: update SideStore source for ${TAG}"
          BODY=$(cat <<EOF
          Release ${TAG} の IPA に合わせて source/apps.json を更新しました。

          - 生成: python3 scripts/generate_source.py --tag ${TAG}
          - 対象: ${TAG} の未署名 IPA
          - 確認: version / downloadURL / size / sha256 / minOSVersion

          branch protection があるため、レビューと review-gate の後にマージしてください。
          EOF
          )

          EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
            echo "Updated existing PR #$EXISTING"
          else
            gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "$TITLE" --body "$BODY"
          fi
